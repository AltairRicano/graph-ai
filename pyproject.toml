[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grafo-ia"
version = "0.3.0"
description = "Estado de un proyecto de código para dar contexto a agentes de IA: cinco documentos en .graph/Estado_Proyecto que se escriben en una sola llamada."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Altair Ricaño" }]
dependencies = []

[project.urls]
Repository = "https://github.com/AltairRicano/graph-ai"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
graph = "grafo_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grafo_ia = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
